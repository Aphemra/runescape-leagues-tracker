name: Refresh Wiki task data

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run import:wiki
      - run: npm test
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: data/wiki-refresh
          delete-branch: true
          commit-message: "data: refresh league tasks from the Wiki"
          title: "Refresh league tasks from the Wiki"
          body: |
            Automated Wiki task refresh.

            The importer records the source page revision, validates task identities and references, and preserves legacy task aliases.
